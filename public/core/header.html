<header id="maintoolbar" md-whiteframe="2" ng-hide="params.headless" layout="row" layout-align="start center">
	<a class="logo" ng-href="{{user.uid ? '/me' : '/'}}">
		<img ng-if="config.site.brand.logo" cl-src="{{config.site.brand.logo}}" transform_w="100" transform_h="100" alt="">
		<h3 id="slogan" ng-show="$mdMedia('gt-sm')">{{config.site.brand.tagline || config.site.brand.name}}</h3>
	</a>
	<span flex></span>

	<a class="md-button" ng-repeat="n in config.site.nav" ng-href="{{n.href}}" ng-show="$mdMedia('gt-sm') && (!n.auth || user)">{{n.label}}</a>

	<button class="md-raised md-primary md-button" type="button" aria-label="Login" ng-hide="user" ng-click="tools.login()">Login</button>

	<md-menu ng-show="profile">
		<md-button aria-label="Open User Menu" ng-click="$mdMenu.open($event)">
			<img ng-if="profile.img" cl-src="{{profile.img}}" transform_w="100" transform_h="100" transform_g="face" class="md-avatar" alt="">
			<span ng-show="$mdMedia('gt-sm')">{{profile.displayName}}</span>
		</md-button>
		<md-menu-content width="4">
			<md-menu-item ng-repeat="n in config.site.nav" ng-if="!n.auth || user" ng-hide="$mdMedia('gt-sm')">
				<a class="md-button" ng-href="{{n.href}}">{{n.label}}</a>
			</md-menu-item>
			<md-menu-item>
				<a class="md-button" href="/me">My Home</a>
			</md-menu-item>
			<md-menu-item ng-show="user.is('root')">
				<a class="md-button" href="/admin">Admin</a>
			</md-menu-item>
			<md-menu-item ng-click="rootTools.quickConnect.show($event)" ng-show="user && rootTools.quickConnect.canCreate()">
				<a class="md-button"><i class="fa fa-key"></i> Get Quick Connect code</a>
			</md-menu-item>
			<md-menu-item ng-click="rootTools.logout()" ng-show="user">
				<a class="md-button">Logout <span style="font-size:small;">({{profile.authEmail}})</span></a>
			</md-menu-item>
		</md-menu-content>
	</md-menu>
</header>
